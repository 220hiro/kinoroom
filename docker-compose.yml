name: kadr
services:
  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN on the external server}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [kadr]
  kadr:
    build: .
    restart: unless-stopped
    expose: ["3000"]
    environment:
      KADR_MEDIA_ENABLED: "1"
      KADR_MAX_STREAMS: ${KADR_MAX_STREAMS:-4}
      TORRSERVER_URL: http://torrserver:8090
      TORRSERVER_AUTH: ${TORRSERVER_AUTH:-}
      SITE_PASSWORD: ${SITE_PASSWORD:?Set a private access password}
      AUTH_SECRET: ${AUTH_SECRET:?Set a random session secret}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      JACKETT_URL: http://jackett:9117
      JACKETT_API_KEY: ${JACKETT_API_KEY:-}
      JACKETT_INDEXERS: ${JACKETT_INDEXERS:-noname-club}
      SUBDL_API_KEY: ${SUBDL_API_KEY:-}
      OPENSUBTITLES_API_KEY: ${OPENSUBTITLES_API_KEY:-}
      OPENSUBTITLES_USERNAME: ${OPENSUBTITLES_USERNAME:-}
      OPENSUBTITLES_PASSWORD: ${OPENSUBTITLES_PASSWORD:-}
    depends_on: [torrserver]
  torrserver:
    image: ghcr.io/yourok/torrserver:latest
    restart: unless-stopped
    expose: ["8090"]
    environment:
      TS_PORT: "8090"
      TS_DONTKILL: "1"
    volumes: ["torrserver_data:/opt/ts"]
  jackett:
    image: lscr.io/linuxserver/jackett:latest
    restart: unless-stopped
    expose: ["9117"]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Qyzylorda
    volumes: ["jackett_data:/config"]
volumes:
  caddy_data:
  caddy_config:
  torrserver_data:
  jackett_data:
