<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#09090b" />
      <stop offset="50%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#09090b" />
    </linearGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />

  <!-- SMPTE-style Test Pattern Bars -->
  <g transform="translate(60, 200)">
    <rect x="0" y="0" width="480" height="260" rx="16" fill="#18181b" stroke="#3f3f46" stroke-width="2" />
    <g transform="translate(20, 20)">
      <rect x="0" y="0" width="62" height="150" fill="#e4e4e7" />
      <rect x="62" y="0" width="62" height="150" fill="#eab308" />
      <rect x="124" y="0" width="62" height="150" fill="#06b6d4" />
      <rect x="186" y="0" width="62" height="150" fill="#22c55e" />
      <rect x="248" y="0" width="62" height="150" fill="#ec4899" />
      <rect x="310" y="0" width="62" height="150" fill="#ef4444" />
      <rect x="372" y="0" width="68" height="150" fill="#3b82f6" />
      <!-- Lower pattern -->
      <rect x="0" y="150" width="110" height="70" fill="#3b82f6" />
      <rect x="110" y="150" width="110" height="70" fill="#18181b" />
      <rect x="220" y="150" width="110" height="70" fill="#ec4899" />
      <rect x="330" y="150" width="110" height="70" fill="#27272a" />
    </g>
  </g>

  <!-- Badge -->
  <rect x="190" y="80" width="220" height="32" rx="16" fill="#3b82f6" fill-opacity="0.2" stroke="#3b82f6" stroke-width="1.5" />
  <text x="300" y="101" fill="#60a5fa" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">APPLE REFERENCE HLS</text>

  <!-- Title -->
  <text x="300" y="580" fill="#ffffff" font-family="system-ui, sans-serif" font-size="40" font-weight="900" text-anchor="middle" letter-spacing="2">BIPBOP fMP4</text>
  <text x="300" y="620" fill="#a1a1aa" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="1">ТЕСТОВЫЙ ПОТОК APPLE</text>

  <!-- Technical badges -->
  <rect x="130" y="680" width="340" height="40" rx="8" fill="#27272a" stroke="#3f3f46" stroke-width="1" />
  <text x="300" y="705" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">FRAGMENTED MP4 • MULTI-AUDIO</text>
</svg>
