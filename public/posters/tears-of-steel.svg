<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 900" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#151b2d" />
      <stop offset="100%" stop-color="#07090e" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="40%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
  </defs>
  <rect width="600" height="900" fill="url(#bg)" />
  <circle cx="300" cy="360" r="260" fill="url(#glow)" />
  
  <!-- Robot/Sci-fi silhouette elements -->
  <path d="M220 280 L380 280 L350 440 L250 440 Z" fill="#1e293b" stroke="#60a5fa" stroke-width="2" opacity="0.6" />
  <circle cx="300" cy="350" r="30" fill="#ef4444" opacity="0.8" />
  <circle cx="300" cy="350" r="12" fill="#ffffff" />
  <line x1="180" y1="480" x2="420" y2="480" stroke="#38bdf8" stroke-width="3" opacity="0.4" />
  <line x1="200" y1="500" x2="400" y2="500" stroke="#38bdf8" stroke-width="1" opacity="0.3" />

  <!-- Badge -->
  <rect x="200" y="80" width="200" height="32" rx="16" fill="#ef4444" fill-opacity="0.2" stroke="#ef4444" stroke-width="1.5" />
  <text x="300" y="101" fill="#f87171" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" text-anchor="middle" letter-spacing="2">BLENDER FOUNDATION</text>

  <!-- Title -->
  <text x="300" y="620" fill="#ffffff" font-family="system-ui, sans-serif" font-size="44" font-weight="900" text-anchor="middle" letter-spacing="4">TEARS OF STEEL</text>
  <text x="300" y="660" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="18" font-weight="600" text-anchor="middle" letter-spacing="2">СЛЁЗЫ СТАЛИ (2012)</text>

  <!-- Technical badges -->
  <rect x="150" y="720" width="300" height="40" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1" />
  <text x="300" y="745" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" letter-spacing="1">1080p HLS • WebVTT SUBTITLES</text>
