<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141724" />
      <stop offset="100%" stop-color="#090a0f" />
    </linearGradient>
    <linearGradient id="redG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a3b" />
      <stop offset="100%" stop-color="#b80012" />
    </linearGradient>
    <linearGradient id="amberG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffc107" />
      <stop offset="100%" stop-color="#ff9800" />
    </linearGradient>
  </defs>
  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="120" fill="url(#bg)" stroke="rgba(255,255,255,0.1)" stroke-width="4" />
  
  <!-- Stylized Film Reel & Play Triangle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#redG)" stroke-width="24" stroke-dasharray="14 10" />
  <circle cx="256" cy="256" r="130" fill="#0d0e17" stroke="rgba(255,255,255,0.08)" stroke-width="8" />
  
  <!-- Glowing Play Glyph -->
  <polygon points="220,180 340,256 220,332" fill="url(#redG)" filter="drop-shadow(0 10px 20px rgba(230,20,40,0.5))" />
  
  <!-- Small Magnet Sparkle in top right -->
  <circle cx="360" cy="150" r="28" fill="url(#amberG)" filter="drop-shadow(0 4px 10px rgba(255,193,7,0.6))" />
</svg>
